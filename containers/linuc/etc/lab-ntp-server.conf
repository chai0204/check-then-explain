# 演習用のローカル NTP サーバ。
# pool.ntp.org は読者の環境で到達性が違い、出力も毎回変わる。
# それでは「同じ画面が出る」が成立しないので、檻の中に基準時計を1台立てる。
# 自分のシステムクロックを stratum 8 の基準として配る。
local stratum 8
allow 127.0.0.1
bindaddress 127.0.0.1
# 既定の 123 で待つ。Ubuntu の chrony は allow を書かない限りサーバとして
# 123 を bind しないので、ここと衝突しない（実測 2026-10-12）。
driftfile /var/lib/chrony/lab-server.drift
pidfile /run/chrony-lab-server.pid
cmdport 0
