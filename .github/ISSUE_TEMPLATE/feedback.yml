name: 感想・内容への提案
description: 面白かった箇所、物足りなかった箇所、扱ってほしいテーマ
title: "[感想] "
labels: ["feedback"]
body:
  - type: markdown
    attributes:
      value: |
        気軽に書いてください。一言でも構いません。

        各ページ下部のコメント欄でも書けます。Issue にするのは、
        **返信をやり取りしたい場合や、内容の変更につながる提案**のときで十分です。

  - type: dropdown
    id: kind
    attributes:
      label: どれに近いか
      options:
        - 読んだ感想
        - ここが物足りなかった・もっと知りたい
        - 扱ってほしいテーマがある
        - その他
    validations:
      required: true

  - type: input
    id: theme
    attributes:
      label: どのテーマか
      placeholder: "SQLite / WASM / シリーズ全体"
    validations:
      required: false

  - type: textarea
    id: body
    attributes:
      label: 内容
    validations:
      required: true

  - type: dropdown
    id: depth
    attributes:
      label: どこまで進めたか（任意）
      description: 感想の読み方が変わるので、分かると助かります
      options:
        - 理論編を読んだだけ
        - 理論編を読んで、演習も通した
        - 演習だけやった
        - 途中でやめた
        - まだ読んでいない（テーマの提案など）
    validations:
      required: false
